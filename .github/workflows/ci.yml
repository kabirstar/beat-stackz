name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres: # lets backend's integration test run instead of skipping
        image: postgres:17
        env:
          POSTGRES_USER: bpackz
          POSTGRES_PASSWORD: bpackz
          POSTGRES_DB: bpackz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bpackz" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bpackz:bpackz@localhost:5432/bpackz_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @bpackz/shared build # others import its dist
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm -r --if-present run db:check # drizzle-kit check in backend
      - name: OpenAPI is in sync with shared schemas
        run: |
          pnpm openapi
          git diff --exit-code -- contracts/openapi.json || {
            echo "::error::contracts/openapi.json is stale. Run 'pnpm openapi' and commit."; exit 1; }
