name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a main run mid-deploy

jobs:
  check: # the gate (ADR 0005): capped at 10 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres: # lets backend's integration test run instead of skipping
        image: postgres:17
        env:
          POSTGRES_USER: bpackz
          POSTGRES_PASSWORD: bpackz
          POSTGRES_DB: bpackz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bpackz" --health-interval 5s --health-timeout 5s --health-retries 10
      rustfs: # lets backend's storage test run real presigned multipart against a bucket
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: bpackz
          RUSTFS_SECRET_KEY: bpackz-secret
        ports: ["9000:9000"]
    env:
      TEST_DATABASE_URL: postgres://bpackz:bpackz@localhost:5432/bpackz_test
      RUN_STORAGE_INTEGRATION: "1"
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: bpackz
      S3_ACCESS_KEY: bpackz
      S3_SECRET_KEY: bpackz-secret
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history; coverage gate diffs against origin/main
      - name: gitleaks (secrets scan, ADR 0004 split gate)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for RustFS
        run: for i in $(seq 1 30); do curl -sf http://localhost:9000/health && exit 0; sleep 1; done; echo "RustFS not ready" && exit 1
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @bpackz/shared build # others import its dist
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm dup # jscpd: no copy-paste, ADR 0005 item 6
      - name: Tests with coverage (backend, shared, frontend; mocked + real deps) # worker: see below
        run: mkdir -p backend/coverage shared/coverage frontend/coverage && pnpm -r --filter '!worker' --if-present run test:cov
      - name: Worker tests (in its image, which has ffmpeg + audiowaveform)
        run: |
          docker build -f worker/Dockerfile --target test -t bpackz-worker:test .
          docker run --rm --network host -e TEST_DATABASE_URL -e RUN_STORAGE_INTEGRATION -e S3_ENDPOINT -e S3_REGION -e S3_BUCKET -e S3_ACCESS_KEY -e S3_SECRET_KEY -e S3_FORCE_PATH_STYLE bpackz-worker:test
      - name: Coverage gate (ADR 0005; changed lines >= 80 %, package floors)
        run: node infra/coverage-gate.mjs
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      - run: pnpm -r --if-present run db:check # drizzle-kit check in backend
      - name: OpenAPI is in sync with shared schemas
        run: |
          pnpm openapi
          git diff --exit-code -- contracts/openapi.json || {
            echo "::error::contracts/openapi.json is stale. Run 'pnpm openapi' and commit."; exit 1; }

  # ---- continuous deployment (ADR 0005): main -> production -> smoke. No staging; tests carry the weight. ----------
  # Off until the repository variable CD_ENABLED is "true" and the `production` environment holds the secrets
  # COOLIFY_URL, COOLIFY_TOKEN, COOLIFY_APP_UUID, INVITE_CODE, DISCORD_UPDATES_WEBHOOK_URL and variables API_URL, WEB_URL (HOSTING.md §6).
  deploy-prod:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency: { group: deploy, cancel-in-progress: false }
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Deploy to production
        run: node infra/deploy.mjs
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      - name: Validate in production (smoke)
        run: node infra/smoke.mjs
        env:
          API: ${{ vars.API_URL }}
          WEB: ${{ vars.WEB_URL }}
          WEB_ORIGIN: ${{ vars.WEB_URL }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
      - name: Report to #brain-updates
        if: always() && env.HOOK != ''
        env:
          HOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
        run: |
          curl -sf -H 'content-type: application/json' -d "{\"content\":\"CD: production deploy of ${SHA:0:7} ${STATUS} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" "$HOOK" || true
