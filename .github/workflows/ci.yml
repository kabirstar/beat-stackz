name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @bpackz/shared build # others import its dist
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: OpenAPI is in sync with shared schemas
        run: |
          pnpm openapi
          git diff --exit-code -- contracts/openapi.json || {
            echo "::error::contracts/openapi.json is stale. Run 'pnpm openapi' and commit."; exit 1; }
