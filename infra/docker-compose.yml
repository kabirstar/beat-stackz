# Local stack. `docker compose -f infra/docker-compose.yml up -d postgres rustfs`
# Hosted: drop rustfs, point S3_* at Cloudflare R2.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bpackz
      POSTGRES_PASSWORD: bpackz
      POSTGRES_DB: bpackz
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpackz"]
      interval: 5s

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: bpackz
      RUSTFS_SECRET_KEY: bpackz-secret
    ports: ["9000:9000", "9001:9001"]   # 9000 S3, 9001 console
    volumes: [blobs:/data]

  api:
    build: { context: .., dockerfile: backend/Dockerfile }
    env_file: ../.env
    environment: # T034: API talks to the bucket by service name; presigned URLs it hands browsers use the host address
      DATABASE_URL: postgres://bpackz:bpackz@postgres:5432/bpackz
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, rustfs: { condition: service_started } }
    restart: unless-stopped
    profiles: [full]

  web:
    build: { context: .., dockerfile: frontend/Dockerfile }
    ports: ["5173:80"]
    profiles: [full]

  worker: # verifies uploads (T015); ffmpeg/audiowaveform arrive with T016
    build: { context: .., dockerfile: worker/Dockerfile }
    env_file: ../.env
    environment: # inside the compose network the services are reachable by name, not localhost
      DATABASE_URL: postgres://bpackz:bpackz@postgres:5432/bpackz
      S3_ENDPOINT: http://rustfs:9000
    depends_on: { postgres: { condition: service_healthy }, rustfs: { condition: service_started } }
    restart: unless-stopped
    profiles: [full]

  backup: # nightly pg_dump -> bucket $BACKUP_BUCKET (T043). Local check: docker compose ... run --rm backup once
    build: { context: .., dockerfile: infra/backup/Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://bpackz:bpackz@postgres:5432/bpackz
      S3_ENDPOINT: http://rustfs:9000
      BACKUP_BUCKET: ${BACKUP_BUCKET:-bpackz-backups}
    depends_on: { postgres: { condition: service_healthy }, rustfs: { condition: service_started } }
    restart: unless-stopped
    profiles: [backup]

volumes:
  pgdata:
  blobs:
