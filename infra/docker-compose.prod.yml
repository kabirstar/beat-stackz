# Hosted override. Use together with the base file:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --profile full up -d --build
# Differences from local: no RustFS (bucket is Cloudflare R2 via S3_* in .env), NODE_ENV=production
# (API refuses non-HTTPS origins), web built with the real API origin, no host ports (the Coolify proxy
# attaches to the compose network and routes app.<domain> -> web:80, api.<domain> -> api:4000).
services:
  rustfs:
    profiles: [local] # never started under --profile full in production

  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  api:
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bpackz:${POSTGRES_PASSWORD}@postgres:5432/bpackz
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT to the R2 S3 endpoint}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT}} # R2: browsers use the same endpoint
    ports: !reset []
    depends_on: !override
      postgres: { condition: service_healthy }

  worker:
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bpackz:${POSTGRES_PASSWORD}@postgres:5432/bpackz
      S3_ENDPOINT: ${S3_ENDPOINT}
    depends_on: !override
      postgres: { condition: service_healthy }

  web:
    build:
      args:
        VITE_API_ORIGIN: ${API_ORIGIN:?set API_ORIGIN, e.g. https://api.example.com}
        VITE_MOCK: "false"
    ports: !reset []
