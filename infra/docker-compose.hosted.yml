# Single-file hosted stack for Coolify (T042). Coolify reads ONE compose file and does not
# enable profiles, so this is the base + prod overlay flattened: no RustFS (blobs in R2),
# no profiles, relative paths, no host ports (Coolify's proxy routes app.<domain> -> web:80,
# api.<domain> -> api:4000). Values come from Coolify's environment panel.
# Build contexts are "." because Coolify runs compose with --project-directory = repo root; for a manual run
# use the same: docker compose --project-directory . -f infra/docker-compose.hosted.yml up -d --build
#   Regenerate the reference: docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --profile full config --no-interpolate
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bpackz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bpackz
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpackz"]
      interval: 5s
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bpackz:${POSTGRES_PASSWORD}@postgres:5432/bpackz
      S3_ENDPOINT: ${S3_ENDPOINT:?R2 S3 endpoint}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT}}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-bpackz}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?R2 access key id}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?R2 secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?32+ random chars}
      INVITE_CODE: ${INVITE_CODE:?invite code for sign-up (ADR 0003)}
      BETTER_AUTH_URL: ${API_ORIGIN:?https origin of the API}
      WEB_ORIGIN: ${WEB_ORIGIN:?https origin of the web app}
      API_ORIGIN: ${API_ORIGIN}
    expose: ["4000"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: worker/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bpackz:${POSTGRES_PASSWORD}@postgres:5432/bpackz
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-bpackz}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_ORIGIN: ${API_ORIGIN}
        VITE_MOCK: "false"
    expose: ["80"]
    depends_on: [api]
    restart: unless-stopped

  backup: # nightly pg_dump -> R2 bucket BACKUP_BUCKET (T043); retention = R2 lifecycle rule
    build: { context: ., dockerfile: infra/backup/Dockerfile }
    environment:
      DATABASE_URL: postgres://bpackz:${POSTGRES_PASSWORD}@postgres:5432/bpackz
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-bpackz-backups} # must exist in R2 and be covered by the token (HOSTING §0)
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata:
